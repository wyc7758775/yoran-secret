<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">广州长隆两日卡通路线图</title>
  <desc id="desc">从汉溪长隆站 E 口出发，第一天游览野生动物世界并观看广州国际大马戏，第二天在水上乐园和欢乐世界之间二选一，最后返程。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f6ff" />
      <stop offset="52%" stop-color="#fff6d4" />
      <stop offset="100%" stop-color="#e6f8d7" />
    </linearGradient>
    <linearGradient id="park" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fd47b" />
      <stop offset="100%" stop-color="#3fa35b" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fe7ff" />
      <stop offset="100%" stop-color="#2e97d8" />
    </linearGradient>
    <linearGradient id="fun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd17a" />
      <stop offset="100%" stop-color="#f27c4a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#193226" flood-opacity=".16" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2b7a4a" />
    </marker>
    <style>
      .label { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1d2a22; }
      .small { font-size: 24px; font-weight: 700; }
      .tiny { font-size: 18px; fill: #506157; }
      .title { font-size: 42px; font-weight: 900; }
      .step-title { font-size: 28px; font-weight: 900; }
      .bubble { fill: rgba(255,255,255,.92); stroke: rgba(29,42,34,.14); stroke-width: 3; }
      .route { fill: none; stroke: #2b7a4a; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .route-alt { fill: none; stroke: #2f84bd; stroke-width: 12; stroke-linecap: round; stroke-dasharray: 22 16; marker-end: url(#arrow); }
      .road { fill: none; stroke: #fff; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; opacity: .92; }
      .road-line { fill: none; stroke: #ffd25d; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 20 18; opacity: .9; }
    </style>
  </defs>

  <rect width="1200" height="860" rx="42" fill="url(#sky)" />
  <circle cx="1030" cy="110" r="58" fill="#ffd95a" opacity=".92" />
  <circle cx="145" cy="130" r="34" fill="#fff" opacity=".86" />
  <circle cx="180" cy="118" r="46" fill="#fff" opacity=".86" />
  <circle cx="225" cy="132" r="34" fill="#fff" opacity=".86" />
  <path d="M0 690 C170 610 315 650 500 610 C690 570 795 625 970 575 C1080 542 1150 570 1200 535 L1200 860 L0 860 Z" fill="#c9ecb8" opacity=".85" />
  <path d="M0 748 C155 705 305 742 462 705 C655 660 816 715 1008 657 C1105 628 1165 642 1200 620 L1200 860 L0 860 Z" fill="#93d682" opacity=".85" />

  <text x="72" y="78" class="label title">广州长隆两日卡通路线图</text>
  <text x="76" y="116" class="label tiny">主线：动物世界 + 大马戏；第二天按天气和体力在水上乐园 / 欢乐世界二选一</text>

  <path class="road" d="M145 662 C185 590 220 520 300 482 C395 436 475 455 535 388 C592 323 680 322 740 380 C790 428 828 505 910 498" />
  <path class="road-line" d="M145 662 C185 590 220 520 300 482 C395 436 475 455 535 388 C592 323 680 322 740 380 C790 428 828 505 910 498" />
  <path class="route" d="M145 662 C185 590 220 520 300 482 C395 436 475 455 535 388 C592 323 680 322 740 380 C790 428 828 505 910 498" />

  <path class="road" d="M598 602 C670 650 744 673 835 650 C910 630 967 590 1034 618" />
  <path class="road-line" d="M598 602 C670 650 744 673 835 650 C910 630 967 590 1034 618" />
  <path class="route-alt" d="M598 602 C670 650 744 673 835 650 C910 630 967 590 1034 618" />

  <g filter="url(#shadow)">
    <rect x="54" y="568" width="190" height="136" rx="28" class="bubble" />
    <circle cx="96" cy="629" r="34" fill="#6fc6ff" />
    <rect x="78" y="604" width="36" height="50" rx="8" fill="#fff" />
    <rect x="84" y="612" width="24" height="8" rx="3" fill="#2f84bd" />
    <circle cx="88" cy="646" r="4" fill="#2f84bd" />
    <circle cx="105" cy="646" r="4" fill="#2f84bd" />
    <text x="132" y="612" class="label step-title">起点</text>
    <text x="132" y="646" class="label small">汉溪长隆站</text>
    <text x="132" y="674" class="label tiny">E 口 + 穿梭巴士</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="376" width="245" height="154" rx="30" fill="url(#park)" />
    <circle cx="293" cy="448" r="38" fill="#fff5d2" />
    <path d="M282 448 C284 426 300 410 320 420 C340 430 338 456 320 468 C302 480 282 470 282 448Z" fill="#bf8a55" />
    <circle cx="298" cy="432" r="5" fill="#1d2a22" />
    <path d="M320 420 L336 405 L330 430" fill="#bf8a55" />
    <path d="M310 420 L318 394 L326 424" fill="#bf8a55" />
    <path d="M330 465 C350 478 374 474 390 456" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" />
    <text x="330" y="420" class="label step-title">Day 1 上午</text>
    <text x="330" y="458" class="label small">野生动物世界</text>
    <text x="330" y="490" class="label tiny">小火车 / 缆车 / 熊猫</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="260" width="210" height="120" rx="28" class="bubble" />
    <circle cx="540" cy="320" r="28" fill="#ffcf65" />
    <path d="M528 324 Q540 306 552 324" stroke="#1d2a22" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M520 340 H566" stroke="#d97128" stroke-width="8" stroke-linecap="round" />
    <text x="580" y="306" class="label step-title">休整</text>
    <text x="580" y="340" class="label tiny">晚饭 / 补水 / 换场</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="392" width="260" height="156" rx="32" fill="#f9edf8" stroke="#e78ad9" stroke-width="4" />
    <path d="M758 504 L818 420 L878 504 Z" fill="#e25b9a" />
    <path d="M818 420 L844 504 H792 Z" fill="#ffd95a" opacity=".9" />
    <circle cx="818" cy="406" r="18" fill="#ffd95a" />
    <path d="M888 436 C928 416 951 452 925 482 C902 510 860 496 870 460" stroke="#2f84bd" stroke-width="10" fill="none" stroke-linecap="round" />
    <text x="780" y="426" class="label step-title">Day 1 晚上</text>
    <text x="780" y="464" class="label small">广州国际大马戏</text>
    <text x="780" y="498" class="label tiny">工作日 19:30；周末可选 16:30</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="158" y="172" width="310" height="154" rx="32" fill="url(#water)" />
    <path d="M204 270 C240 238 284 300 324 260 C356 228 390 260 424 240" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round" />
    <path d="M238 216 C272 178 306 218 275 254" stroke="#ff7b52" stroke-width="18" fill="none" stroke-linecap="round" />
    <circle cx="220" cy="244" r="18" fill="#fff45a" />
    <text x="318" y="210" class="label step-title">Day 2A</text>
    <text x="318" y="248" class="label small">水上乐园</text>
    <text x="318" y="282" class="label tiny">热天优先；周五/周六可玩更晚</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="515" y="620" width="295" height="156" rx="32" fill="url(#fun)" />
    <path d="M548 720 C590 650 660 650 702 720 C728 762 780 734 792 680" stroke="#7f3fbf" stroke-width="12" fill="none" stroke-linecap="round" />
    <circle cx="590" cy="681" r="12" fill="#fff" />
    <circle cx="704" cy="720" r="12" fill="#fff" />
    <path d="M555 718 H792" stroke="#7f3fbf" stroke-width="6" stroke-dasharray="12 10" />
    <text x="622" y="662" class="label step-title">Day 2B</text>
    <text x="622" y="700" class="label small">欢乐世界</text>
    <text x="622" y="734" class="label tiny">刺激项目；先查设备维护</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="928" y="574" width="210" height="120" rx="28" class="bubble" />
    <circle cx="982" cy="636" r="28" fill="#d6f2ff" />
    <path d="M962 642 H1002" stroke="#2f84bd" stroke-width="8" stroke-linecap="round" />
    <path d="M990 626 L1005 642 L990 658" stroke="#2f84bd" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1030" y="620" class="label step-title">返程</text>
    <text x="1030" y="654" class="label tiny">地铁 / 打车</text>
  </g>

  <g>
    <rect x="72" y="752" width="410" height="58" rx="18" fill="#ffffff" opacity=".86" />
    <circle cx="104" cy="781" r="12" fill="#2b7a4a" />
    <text x="126" y="790" class="label tiny">绿色实线：最推荐主线，适合只去 1 天也照着走。</text>
    <rect x="716" y="752" width="382" height="58" rx="18" fill="#ffffff" opacity=".86" />
    <circle cx="748" cy="781" r="12" fill="#2f84bd" />
    <text x="770" y="790" class="label tiny">蓝色虚线：第二天备选线，按天气和设备开放决定。</text>
  </g>
</svg>

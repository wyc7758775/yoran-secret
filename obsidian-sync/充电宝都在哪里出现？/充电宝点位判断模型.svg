<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <rect width="980" height="620" fill="#fbfaf7"/>
  <text x="48" y="58" font-family="PingFang SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#242424">点位是否适合投放：先逻辑初筛，再数据验证</text>
  <text x="48" y="92" font-family="PingFang SC, Arial, sans-serif" font-size="16" fill="#666">核心不是“人多”，而是这些条件叠加之后，借用概率是否足够高。</text>

  <rect x="60" y="135" width="180" height="98" rx="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="95" y="174" font-family="PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#222">人流量</text>
  <text x="92" y="204" font-family="PingFang SC, Arial, sans-serif" font-size="15" fill="#666">分母足够大</text>

  <rect x="280" y="135" width="180" height="98" rx="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="315" y="174" font-family="PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#222">停留时间</text>
  <text x="314" y="204" font-family="PingFang SC, Arial, sans-serif" font-size="15" fill="#666">借用动作成立</text>

  <rect x="500" y="135" width="180" height="98" rx="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="532" y="174" font-family="PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#222">手机刚需</text>
  <text x="533" y="204" font-family="PingFang SC, Arial, sans-serif" font-size="15" fill="#666">支付/导航/联系</text>

  <rect x="720" y="135" width="180" height="98" rx="16" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="752" y="174" font-family="PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#222">替代弱度</text>
  <text x="756" y="204" font-family="PingFang SC, Arial, sans-serif" font-size="15" fill="#666">插座不方便</text>

  <path d="M240 184 L280 184" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M460 184 L500 184" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 184 L720 184" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="170" y="300" width="250" height="105" rx="18" fill="#ffcf56" stroke="#a96a00" stroke-width="2"/>
  <text x="222" y="342" font-family="PingFang SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#3a2600">低电量焦虑</text>
  <text x="212" y="375" font-family="PingFang SC, Arial, sans-serif" font-size="16" fill="#4b3300">用户愿意花小钱买确定性</text>

  <rect x="560" y="300" width="250" height="105" rx="18" fill="#9be7c3" stroke="#2b7b50" stroke-width="2"/>
  <text x="626" y="342" font-family="PingFang SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#10321f">点位可运营</text>
  <text x="606" y="375" font-family="PingFang SC, Arial, sans-serif" font-size="16" fill="#16472e">可归还、可维护、可分成</text>

  <path d="M810 233 C820 270, 785 290, 745 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M150 233 C145 275, 185 292, 225 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 353 L560 353" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="285" y="475" width="410" height="90" rx="20" fill="#7fc8f8" stroke="#266a91" stroke-width="2.5"/>
  <text x="377" y="515" font-family="PingFang SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#062236">真实转化率验证</text>
  <text x="331" y="547" font-family="PingFang SC, Arial, sans-serif" font-size="16" fill="#0b334d">看到 → 扫码 → 借用 → 顺利归还 → 复购</text>

  <path d="M295 405 C320 445, 385 462, 455 475" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M685 405 C660 445, 595 462, 525 475" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="85" y="582" font-family="PingFang SC, Arial, sans-serif" font-size="15" fill="#666">前面是推理，最后要靠真实数据收口。否则“我觉得适合”只是纸面判断。</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
